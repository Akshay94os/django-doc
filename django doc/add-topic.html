<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Add a new Django notes topic to your collection." />
    <title>Add New Topic — Django Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --bg-900: #0a0e1a;
            --bg-card: rgba(20, 28, 51, 0.75);
            --green: #00e5a0;
            --blue: #3b8bff;
            --purple: #8b5cf6;
            --text-1: #f0f4ff;
            --text-2: #a8b4d0;
            --text-3: #5e6e94;
            --border: rgba(59, 139, 255, 0.15);
            --border-focus: rgba(0, 229, 160, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-900);
            color: var(--text-1);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 50% at 20% -5%, rgba(59, 139, 255, 0.12) 0%, transparent 60%), radial-gradient(ellipse 50% 40% at 80% 90%, rgba(0, 229, 160, 0.09) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(59, 139, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 139, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }
        
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.3;
            animation: orbFloat 12s ease-in-out infinite;
        }
        
        .orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(59, 139, 255, 0.3);
            top: -80px;
            right: -80px;
            animation-delay: -3s;
        }
        
        .orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(0, 229, 160, 0.28);
            bottom: 5%;
            left: -60px;
            animation-delay: -7s;
        }
        
        @keyframes orbFloat {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(20px, -15px);
            }
        }
        /* ── NAVBAR ── */
        
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
        }
        
        .nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            gap: 1rem;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        
        .nav-logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--blue), var(--green));
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.7rem;
            color: #fff;
        }
        
        .nav-brand-text {
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, var(--text-1), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-home-link {
            text-decoration: none;
            color: var(--text-2);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.45rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .nav-home-link:hover {
            color: var(--text-1);
            background: rgba(59, 139, 255, 0.08);
            border-color: rgba(59, 139, 255, 0.3);
        }
        
        .nav-home-link svg {
            width: 15px;
            height: 15px;
        }
        /* ── PAGE LAYOUT ── */
        
        .page-wrapper {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem 6rem;
        }
        /* ── FORM CARD ── */
        
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            animation: fadeInUp 0.5s ease both;
        }
        
        .form-card-header {
            padding: 2rem 2.5rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(59, 139, 255, 0.05), rgba(0, 229, 160, 0.05));
        }
        
        .form-card-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(0, 229, 160, 0.08);
            border: 1px solid rgba(0, 229, 160, 0.2);
            border-radius: 6px;
            padding: 0.25rem 0.7rem;
            font-size: 0.72rem;
            color: var(--green);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        
        .form-card-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-1) 0%, var(--green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .form-card-subtitle {
            font-size: 0.9rem;
            color: var(--text-3);
        }
        
        .form-body {
            padding: 2rem 2.5rem;
        }
        /* ── FORM FIELDS ── */
        
        .form-group {
            margin-bottom: 1.6rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 0.5rem;
        }
        
        .form-label span {
            color: var(--green);
            margin-left: 2px;
        }
        
        .form-input,
        .form-textarea {
            width: 100%;
            background: rgba(8, 12, 24, 0.7);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-1);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            padding: 0.85rem 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        
        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--text-3);
        }
        
        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.08);
            background: rgba(8, 12, 24, 0.9);
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 140px;
            line-height: 1.65;
            font-family: 'Outfit', sans-serif;
        }
        
        .char-count {
            font-size: 0.75rem;
            color: var(--text-3);
            text-align: right;
            margin-top: 0.35rem;
            font-family: 'JetBrains Mono', monospace;
        }
        /* ── CODE SECTIONS ── */
        
        .sections-area {
            margin-bottom: 1.6rem;
        }
        
        .sections-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.7rem;
        }
        
        .sections-label-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-2);
        }
        
        .add-section-btn {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(59, 139, 255, 0.08);
            border: 1px solid rgba(59, 139, 255, 0.2);
            color: var(--blue);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }
        
        .add-section-btn:hover {
            background: rgba(59, 139, 255, 0.15);
            border-color: rgba(59, 139, 255, 0.4);
        }
        
        .add-section-btn svg {
            width: 13px;
            height: 13px;
        }
        
        .section-block {
            background: rgba(8, 12, 24, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1.2rem 1.3rem;
            margin-bottom: 1rem;
            position: relative;
        }
        
        .section-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }
        
        .section-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-3);
            font-weight: 600;
        }
        
        .remove-section-btn {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }
        
        .remove-section-btn:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        
        .section-heading-input {
            width: 100%;
            margin-bottom: 0.7rem;
            background: rgba(15, 21, 38, 0.8);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text-1);
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            padding: 0.6rem 0.9rem;
            outline: none;
            transition: all 0.25s ease;
        }
        
        .section-heading-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(0, 229, 160, 0.07);
        }
        
        .section-heading-input::placeholder {
            color: var(--text-3);
        }
        
        .section-code-input {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            background: rgba(15, 21, 38, 0.8);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: #c9d1e0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.6;
            padding: 0.8rem 1rem;
            outline: none;
            transition: all 0.25s ease;
            tab-size: 4;
        }
        
        .section-code-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(0, 229, 160, 0.07);
        }
        
        .section-code-input::placeholder {
            color: var(--text-3);
        }
        /* ── SUBMIT BUTTON ── */
        
        .form-footer {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-top: 1rem;
        }
        
        .submit-btn {
            flex: 1;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(59, 139, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 139, 255, 0.5);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .cancel-btn {
            text-decoration: none;
            color: var(--text-3);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.9rem 1.4rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: all 0.25s ease;
        }
        
        .cancel-btn:hover {
            color: var(--text-1);
            border-color: rgba(59, 139, 255, 0.3);
        }
        /* ── SUCCESS TOAST ── */
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            background: rgba(0, 229, 160, 0.12);
            border: 1px solid rgba(0, 229, 160, 0.4);
            backdrop-filter: blur(14px);
            border-radius: var(--radius-sm);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        
        .toast-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 229, 160, 0.2);
            border: 1px solid rgba(0, 229, 160, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green);
        }
        
        .toast-text {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-1);
        }
        
        .toast-sub {
            font-size: 0.78rem;
            color: var(--text-3);
            margin-top: 0.1rem;
        }
        /* ── Topic count badge ── */
        
        .topic-count-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            animation: fadeInUp 0.4s ease both;
        }
        
        .topic-count-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(59, 139, 255, 0.08);
            border: 1px solid rgba(59, 139, 255, 0.2);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.82rem;
            color: var(--blue);
            font-weight: 600;
        }
        
        .topic-count-num {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 600px) {
            .page-wrapper {
                padding: 1.5rem 1rem 4rem;
            }
            .form-card-header,
            .form-body {
                padding: 1.5rem;
            }
            .form-footer {
                flex-direction: column;
            }
            .cancel-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-brand">
                <div class="nav-logo-icon">DJ</div>
                <span class="nav-brand-text">Django Notes</span>
            </a>
            <a href="index.html" class="nav-home-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg> Back to Home
            </a>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="page-wrapper">

        <!-- Stats row -->
        <div class="topic-count-row">
            <div class="topic-count-badge">
                <span>Total Topics:</span>
                <span class="topic-count-num" id="count-display">30</span>
            </div>
        </div>

        <!-- Form card -->
        <div class="form-card">
            <div class="form-card-header">
                <div class="form-card-badge">New Topic</div>
                <h1 class="form-card-title">Add New Topic</h1>
                <p class="form-card-subtitle">Create a custom Django note topic that will be saved to your browser and appear in the topic list.</p>
            </div>

            <div class="form-body">
                <form id="add-topic-form" novalidate>

                    <!-- Title -->
                    <div class="form-group">
                        <label class="form-label" for="topic-title-input">
              Topic Title <span>*</span>
            </label>
                        <input type="text" id="topic-title-input" class="form-input" placeholder="e.g. Django REST Framework Basics" maxlength="100" required autocomplete="off" />
                        <div class="char-count"><span id="title-count">0</span> / 100</div>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label class="form-label" for="topic-desc-input">
              Description <span>*</span>
            </label>
                        <textarea id="topic-desc-input" class="form-textarea" placeholder="Write a clear explanation of this topic. You can use HTML tags for formatting, e.g. &lt;code&gt;snippet&lt;/code&gt;" maxlength="2000" required></textarea>
                        <div class="char-count"><span id="desc-count">0</span> / 2000</div>
                    </div>

                    <!-- Code Sections -->
                    <div class="sections-area">
                        <div class="sections-label">
                            <span class="sections-label-text">Code Sections (optional)</span>
                            <button type="button" class="add-section-btn" id="add-section-btn" onclick="addSection()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                Add Section
              </button>
                        </div>
                        <div id="sections-list">
                            <!-- Dynamic sections added here -->
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="form-footer">
                        <button type="submit" class="submit-btn" id="submit-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
              </svg>
              Save Topic
            </button>
                        <a href="index.html" class="cancel-btn" id="cancel-link">Cancel</a>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast">
        <div class="toast-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
        </div>
        <div>
            <div class="toast-text">Topic saved successfully!</div>
            <div class="toast-sub" id="toast-sub">Redirecting to home...</div>
        </div>
    </div>

    <script src="topics-data.js"></script>
    <script>
        var sectionCount = 0;

        // ── Update topic count display ────────────────────────────
        function updateCount() {
            var topics = getTopics();
            document.getElementById('count-display').textContent = topics.length;
        }

        // ── Character counters ────────────────────────────────────
        document.getElementById('topic-title-input').addEventListener('input', function() {
            document.getElementById('title-count').textContent = this.value.length;
        });

        document.getElementById('topic-desc-input').addEventListener('input', function() {
            document.getElementById('desc-count').textContent = this.value.length;
        });

        function buildSectionBlock(n, heading, code) {
            var list = document.getElementById('sections-list');
            var block = document.createElement('div');
            block.className = 'section-block';
            block.id = 'section-block-' + n;

            block.innerHTML =
                '<div class="section-block-header">' +
                '<span class="section-num">Section ' + n + '</span>' +
                '<button type="button" class="remove-section-btn" onclick="removeSection(' + n + ')">Remove</button>' +
                '</div>' +
                '<input type="text" class="section-heading-input" id="sec-heading-' + n + '" placeholder="Heading (e.g. views.py)" />' +
                '<textarea class="section-code-input" id="sec-code-' + n + '" placeholder="Paste your code here..." rows="6"></textarea>';

            var headingInput = block.querySelector('.section-heading-input');
            var codeInput = block.querySelector('.section-code-input');
            if (headingInput) headingInput.value = heading || '';
            if (codeInput) codeInput.value = code || '';

            list.appendChild(block);
            return block;
        }

        // ── Add code section ──────────────────────────────────────
        function addSection() {
            sectionCount++;
            buildSectionBlock(sectionCount, '', '');
        }

        function removeSection(n) {
            var el = document.getElementById('section-block-' + n);
            if (el) el.remove();
        }

        // ── Gather sections ───────────────────────────────────────
        function collectSections() {
            var sections = [];
            var blocks = document.querySelectorAll('.section-block');
            blocks.forEach(function(block) {
                var id = block.id.replace('section-block-', '');
                var heading = (document.getElementById('sec-heading-' + id) || {}).value || '';
                var code = (document.getElementById('sec-code-' + id) || {}).value || '';
                if (heading.trim() || code.trim()) {
                    sections.push({
                        heading: heading.trim() || 'Code',
                        code: code
                    });
                }
            });
            return sections;
        }

        // ── Show toast ────────────────────────────────────────────
        function showToast(msg, sub) {
            var toast = document.getElementById('toast');
            toast.querySelector('.toast-text').textContent = msg;
            document.getElementById('toast-sub').textContent = sub || '';
            toast.classList.add('show');
        }

        function getEditTopicId() {
            var params = new URLSearchParams(window.location.search);
            var id = parseInt(params.get('edit'), 10);
            return Number.isFinite(id) ? id : null;
        }

        function loadTopicForEdit() {
            var editId = getEditTopicId();
            if (!editId) return;

            var topics = getTopics();
            var topic = topics.find(function(t) {
                return t.id === editId;
            });

            if (!topic) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('topic-title-input').value = topic.title || '';
            document.getElementById('topic-desc-input').value = topic.description || '';
            document.getElementById('title-count').textContent = (topic.title || '').length;
            document.getElementById('desc-count').textContent = (topic.description || '').length;
            document.querySelector('.form-card-badge').textContent = 'Edit Topic';
            document.querySelector('.form-card-title').textContent = 'Edit Topic';
            document.querySelector('.form-card-subtitle').textContent = 'Update the topic content and add more information to this topic.';
            document.getElementById('submit-btn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Update Topic';

            var sections = topic.sections || [];
            if (sections.length > 0) {
                sections.forEach(function(sec, idx) {
                    sectionCount = idx + 1;
                    buildSectionBlock(sectionCount, sec.heading || 'Code', sec.code || '');
                });
            } else {
                addSection();
            }
        }

        // ── Submit form ───────────────────────────────────────────
        document.getElementById('add-topic-form').addEventListener('submit', function(e) {
            e.preventDefault();

            var title = document.getElementById('topic-title-input').value.trim();
            var description = document.getElementById('topic-desc-input').value.trim();
            var editId = getEditTopicId();

            if (!title) {
                document.getElementById('topic-title-input').focus();
                document.getElementById('topic-title-input').style.borderColor = 'rgba(239,68,68,0.6)';
                setTimeout(function() {
                    document.getElementById('topic-title-input').style.borderColor = '';
                }, 1500);
                return;
            }

            if (!description) {
                document.getElementById('topic-desc-input').focus();
                document.getElementById('topic-desc-input').style.borderColor = 'rgba(239,68,68,0.6)';
                setTimeout(function() {
                    document.getElementById('topic-desc-input').style.borderColor = '';
                }, 1500);
                return;
            }

            var sections = collectSections();
            var topics = getTopics();

            if (editId) {
                var index = topics.findIndex(function(t) {
                    return t.id === editId;
                });

                if (index !== -1) {
                    topics[index] = {
                        ...topics[index],
                        title: title,
                        description: description,
                        sections: sections.length > 0 ? sections : [{
                            heading: 'Notes',
                            code: description
                        }]
                    };
                    saveTopics(topics);
                    showToast('Topic updated!', 'Redirecting to home...');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1600);
                    return;
                }
            }

            var newId = topics.length > 0 ? Math.max.apply(null, topics.map(function(t) {
                return t.id;
            })) + 1 : 1;
            var newTopic = {
                id: newId,
                title: title,
                description: description,
                sections: sections.length > 0 ? sections : [{
                    heading: 'Notes',
                    code: description
                }]
            };

            topics.push(newTopic);
            saveTopics(topics);

            showToast('Topic #' + newId + ' saved!', 'Redirecting to home...');

            setTimeout(function() {
                window.location.href = 'index.html';
            }, 1800);
        });

        // ── Init ──────────────────────────────────────────────────
        updateCount();
        loadTopicForEdit();
    </script>
</body>

</html>
