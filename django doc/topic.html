<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Django Notes topic page — detailed explanation and code samples." />
    <title>Topic — Django Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --bg-900: #0a0e1a;
            --bg-card: rgba(20, 28, 51, 0.75);
            --bg-code: rgba(8, 12, 24, 0.9);
            --green: #00e5a0;
            --blue: #3b8bff;
            --purple: #8b5cf6;
            --orange: #f97316;
            --yellow: #fbbf24;
            --text-1: #f0f4ff;
            --text-2: #a8b4d0;
            --text-3: #5e6e94;
            --border: rgba(59, 139, 255, 0.15);
            --border-hover: rgba(0, 229, 160, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-900);
            color: var(--text-1);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 50% at 15% 0%, rgba(59, 139, 255, 0.12) 0%, transparent 60%), radial-gradient(ellipse 50% 40% at 85% 90%, rgba(0, 229, 160, 0.09) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(59, 139, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 139, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }
        /* ── NAVBAR ── */
        
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
        }
        
        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            gap: 1rem;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        
        .nav-logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--blue), var(--green));
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.7rem;
            color: #fff;
            flex-shrink: 0;
        }
        
        .nav-brand-text {
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, var(--text-1), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-link {
            text-decoration: none;
            color: var(--text-2);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.45rem 1rem;
            border-radius: var(--radius-sm);
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }
        
        .nav-link:hover {
            color: var(--text-1);
            background: rgba(59, 139, 255, 0.08);
            border-color: var(--border);
        }
        
        .nav-btn {
            text-decoration: none;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 139, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 139, 255, 0.45);
        }
        
        .nav-btn svg {
            width: 15px;
            height: 15px;
        }
        /* ── LAYOUT ── */
        
        .page-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 2rem 6rem;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2rem;
            align-items: start;
        }
        /* ── SIDEBAR ── */
        
        .sidebar {
            position: sticky;
            top: 80px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(12px);
            padding: 1.2rem 0;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }
        
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        .sidebar-title {
            padding: 0 1.2rem 0.8rem;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.5rem;
        }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1.2rem;
            text-decoration: none;
            color: var(--text-2);
            font-size: 0.82rem;
            font-weight: 500;
            border-left: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .sidebar-item:hover {
            color: var(--text-1);
            background: rgba(59, 139, 255, 0.06);
            border-left-color: var(--blue);
        }
        
        .sidebar-item.active {
            color: var(--green);
            background: rgba(0, 229, 160, 0.06);
            border-left-color: var(--green);
        }
        
        .sidebar-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-3);
            min-width: 22px;
        }
        
        .sidebar-item.active .sidebar-num {
            color: var(--green);
        }
        /* ── CONTENT ── */
        
        .content {
            min-width: 0;
        }
        /* Breadcrumb */
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.82rem;
            color: var(--text-3);
        }
        
        .breadcrumb a {
            color: var(--text-3);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .breadcrumb a:hover {
            color: var(--green);
        }
        
        .breadcrumb-sep {
            color: var(--text-3);
        }
        
        .breadcrumb-current {
            color: var(--text-2);
        }
        /* Topic header */
        
        .topic-header {
            margin-bottom: 2rem;
            animation: fadeInUp 0.5s ease both;
        }
        
        .topic-page-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(59, 139, 255, 0.1);
            border: 1px solid rgba(59, 139, 255, 0.25);
            border-radius: 6px;
            padding: 0.28rem 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--blue);
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .topic-main-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            background: linear-gradient(135deg, var(--text-1) 0%, var(--green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.2rem;
        }
        
        .topic-description {
            font-size: 1rem;
            color: var(--text-2);
            line-height: 1.75;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--green);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 1.2rem 1.5rem;
            animation: fadeInUp 0.5s ease 0.1s both;
        }
        
        .topic-description code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            color: var(--green);
            background: rgba(0, 229, 160, 0.1);
            padding: 0.1em 0.4em;
            border-radius: 4px;
        }
        /* Code sections */
        
        .code-section {
            margin-bottom: 1.8rem;
            animation: fadeInUp 0.5s ease both;
        }
        
        .code-section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 21, 38, 0.9);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            padding: 0.7rem 1.2rem;
        }
        
        .code-section-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-2);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .code-dots {
            display: flex;
            gap: 5px;
        }
        
        .code-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        
        .code-dot:nth-child(1) {
            background: #ff5f57;
        }
        
        .code-dot:nth-child(2) {
            background: #febc2e;
        }
        
        .code-dot:nth-child(3) {
            background: #28c840;
        }
        
        .copy-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(59, 139, 255, 0.1);
            border: 1px solid rgba(59, 139, 255, 0.2);
            color: var(--text-2);
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .copy-btn:hover {
            background: rgba(0, 229, 160, 0.1);
            border-color: rgba(0, 229, 160, 0.3);
            color: var(--green);
        }
        
        .copy-btn.copied {
            background: rgba(0, 229, 160, 0.15);
            border-color: rgba(0, 229, 160, 0.4);
            color: var(--green);
        }
        
        .copy-btn svg {
            width: 13px;
            height: 13px;
        }
        
        .code-block {
            background: var(--bg-code);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            padding: 1.4rem 1.5rem;
            overflow-x: auto;
        }
        
        .code-block pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #c9d1e0;
            white-space: pre;
            tab-size: 4;
        }
        /* ── NAV BUTTONS (prev/next) ── */
        
        .topic-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            animation: fadeInUp 0.5s ease both;
        }
        
        .topic-nav-btn {
            text-decoration: none;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .topic-nav-btn.prev {
            flex-direction: row;
            gap: 1rem;
        }
        
        .topic-nav-btn.next {
            flex-direction: row-reverse;
            text-align: right;
            gap: 1rem;
        }
        
        .topic-nav-btn:hover {
            border-color: var(--border-hover);
            box-shadow: 0 8px 30px rgba(0, 229, 160, 0.12);
            transform: translateY(-2px);
        }
        
        .topic-nav-btn.disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        
        .nav-btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(59, 139, 255, 0.15), rgba(0, 229, 160, 0.15));
            border: 1px solid rgba(59, 139, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--green);
        }
        
        .nav-btn-text {
            flex: 1;
            min-width: 0;
        }
        
        .nav-btn-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.2rem;
        }
        
        .nav-btn-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .topic-nav-btn:hover .nav-btn-title {
            color: var(--green);
        }
        /* ── Animations ── */
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* ── Responsive ── */
        
        @media (max-width: 900px) {
            .page-wrapper {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }
        
        @media (max-width: 600px) {
            .page-wrapper {
                padding: 1.5rem 1rem 4rem;
            }
            .topic-nav {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <nav class="navbar">

            <div class="topic-header" id="topic-header">

                    <a href="#" id="edit-topic-btn" class="nav-btn" style="background: linear-gradient(135deg, var(--green), var(--blue)); box-shadow: 0 4px 15px rgba(0, 229, 160, 0.3); padding: 0.4rem 1rem; font-size: 0.8rem;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>

    <script src="topics-data.js"></script>
    <script>
        // ── Get current topic ID from URL ─────────────────────────
        function getTopicId() {
            var params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id')) || 1;
        }

        // ── Simple syntax highlighter ─────────────────────────────
        function highlight(code) {
            var escaped = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // order matters
            escaped = escaped
                // comments (#)
                .replace(/(#[^\n]*)/g, '<span class="cmt">$1</span>')
                // Django template tags {{ }} and {% %}
                .replace(/(\{\{[^}]*\}\})/g, '<span class="fn">$1</span>')
                .replace(/(\{%[^%]*%\})/g, '<span>$1</span>')
                // Python keywords
                .replace(/\b(def|class|return|from|import|if|elif|else|for|in|not|and|or|True|False|None|with|try|except|raise|pass|break|continue|lambda|yield|as|global|nonlocal|del|assert|while|is)\b/g, '<span>$1</span>')
                // strings
                .replace(/(&#39;[^&#]*&#39;|&quot;[^&]*&quot;|'[^']*'|"[^"]*")/g, '<span class="str">$1</span>')
                // numbers
                .replace(/\b(\d+)\b/g, '<span class="num">$1</span>');

            return escaped;
        }

        // ── Render a code section ─────────────────────────────────
        function renderSection(section, index, animDelay) {
            var wrapper = document.createElement('div');
            wrapper.className = 'code-section';
            wrapper.style.animationDelay = animDelay + 's';

            var copyId = 'code-' + index;

            wrapper.innerHTML =
                '<div class="code-section-heading">' +
                '<div class="code-section-label">' +
                '<div class="code-dots">' +
                '<div class="code-dot"></div>' +
                '<div class="code-dot"></div>' +
                '<div class="code-dot"></div>' +
                '</div>' +
                escHtml(section.heading) +
                '</div>' +
                '<button class="copy-btn" data-index="' + index + '" id="copybtn-' + index + '" onclick="copyCode(' + index + ')" aria-label="Copy code">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
                'Copy' +
                '</button>' +
                '</div>' +
                '<div class="code-block"><pre id="' + copyId + '">' + highlight(section.code) + '</pre></div>';

            return wrapper;
        }

        function escHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ── Copy code to clipboard ────────────────────────────────
        var rawCodes = [];

        function copyCode(index) {
            var btn = document.getElementById('copybtn-' + index);
            navigator.clipboard.writeText(rawCodes[index] || '').then(function() {
                btn.classList.add('copied');
                btn.innerHTML =
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' +
                    'Copied!';
                setTimeout(function() {
                    btn.classList.remove('copied');
                    btn.innerHTML =
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
                        'Copy';
                }, 2000);
            });
        }

        // ── Build sidebar ─────────────────────────────────────────
        function buildSidebar(topics, currentId) {
            var sidebar = document.getElementById('sidebar');
            topics.forEach(function(t) {
                var item = document.createElement('a');
                item.className = 'sidebar-item' + (t.id === currentId ? ' active' : '');
                item.href = 'topic.html?id=' + t.id;
                item.innerHTML =
                    '<span class="sidebar-num">' + String(t.id).padStart(2, '0') + '</span>' +
                    '<span>' + escHtml(t.title) + '</span>';
                sidebar.appendChild(item);
            });
        }

        // ── Mount topic page ──────────────────────────────────────
        function mountTopic() {
            var currentId = getTopicId();
            var topics = getTopics();
            var idx = topics.findIndex(function(t) {
                return t.id === currentId;
            });

            if (idx === -1) {
                document.getElementById('topic-title').textContent = 'Topic not found';
                return;
            }

            var topic = topics[idx];

            // Page title
            document.title = 'Page ' + topic.id + ' — ' + topic.title + ' | Django Notes';
            document.querySelector('meta[name="description"]').setAttribute('content', topic.description.replace(/<[^>]+>/g, ''));

            // Breadcrumb
            document.getElementById('breadcrumb-title').textContent = topic.title;

            // Header
            document.getElementById('topic-badge').textContent = 'Page ' + String(topic.id).padStart(2, '0');
            document.getElementById('topic-title').textContent = topic.title;
            document.getElementById('topic-description').innerHTML = topic.description;
            document.getElementById('edit-topic-btn').href = 'add-topic.html?edit=' + topic.id;

            // Sections
            var container = document.getElementById('sections-container');
            rawCodes = [];
            (topic.sections || []).forEach(function(sec, i) {
                rawCodes.push(sec.code);
                container.appendChild(renderSection(sec, i, 0.15 + i * 0.08));
            });

            // Sidebar
            buildSidebar(topics, currentId);

            // Prev/Next buttons
            var prevTopic = idx > 0 ? topics[idx - 1] : null;
            var nextTopic = idx < topics.length - 1 ? topics[idx + 1] : null;

            var btnPrev = document.getElementById('btn-prev');
            var btnNext = document.getElementById('btn-next');

            if (prevTopic) {
                btnPrev.href = 'topic.html?id=' + prevTopic.id;
                document.getElementById('prev-title').textContent = prevTopic.title;
            } else {
                btnPrev.classList.add('disabled');
                document.getElementById('prev-title').textContent = 'No previous topic';
            }

            if (nextTopic) {
                btnNext.href = 'topic.html?id=' + nextTopic.id;
                document.getElementById('next-title').textContent = nextTopic.title;
            } else {
                btnNext.classList.add('disabled');
                document.getElementById('next-title').textContent = 'No next topic';
            }
        }

        mountTopic();
    </script>
</body>

</html>
